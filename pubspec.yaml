name: pdf_reader
description: A Flutter app for reading PDF files.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  file_picker: ^11.0.2
  pdfrx: ^2.4.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  crypto: ^3.0.6
  flutter_tts: ^4.2.0
  flutter_foreground_task: ^9.2.2
  google_mlkit_text_recognition: ^0.15.1
  flutter_markdown: ^0.7.7
  share_plus: ^12.0.0
  wakelock_plus: ^1.5.2
  screen_brightness: ^2.1.9
  epub_plus: ^5.1.0
  archive: ^4.0.2
  logger: ^2.7.0
  html2md: ^1.3.2
  provider: ^6.1.5+1
  lru: ^1.0.3
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
